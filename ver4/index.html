<!DOCTYPE html>
<html lang="en">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matthew J 官方網站</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/TextPlugin.min.js"></script>
</head>
<body>
    <div class="banner scrambled-banner">
        <img src="img/chicken.png" alt="icon">
        <div class="scrambled-text" id="scrambledText">Matthew J 官方基地</div>
    </div>
    <div class="game-container">
        <canvas id="canvas1"></canvas>
        <img src="img/user/00_idle/0.png" alt="User" id="user" class="feature">
        <div class="Background">
            <img src="img/bg00.png" alt="Background Left" id="bg00">
            <img src="img/bbg00.png" alt="moving Background Left" id="bbg00">
            <img src="img/bg01.png" alt="Background Middle" id="bg01">
            <img src="img/bbg01.png" alt="moving Background Middle" id="bbg01">
            <img src="img/bg02.png" alt="Background Right" id="bg02">
            <img src="img/bbg02.png" alt="moving Background Right" id="bbg02">
        </div>
        <div class="npc">
            <img src="img/pure.png" alt="NPC" id="npc0">
            <img src="img/henry.png" alt="NPC" id="npc1">
            <img src="img/yeah.png" alt="NPC" id="npc2">
        </div>
    </div>
    <div class="bluring page" id="bluringPage">
        <div class="blurp1" id="blurp1">
        </div>
        <div class="blurp2" id="blurp2">
        </div>
        <div class="blurp3" id="blurp3">
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
